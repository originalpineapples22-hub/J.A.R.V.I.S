# Fly.io configuration for 0.5.4.M.4
# Deploy with:  fly launch --no-deploy   then   fly deploy
app = "jarvis-core"          # `fly launch` will rename this to your chosen app name
primary_region = "cdg"       # change to the region nearest you (see the guide)

[build]

[env]
  JARVIS_DATA = "/data"
  JARVIS_TZ = "Asia/Muscat"
  PORT = "8080"

# Persistent disk — this is what keeps your memory, settings and files
# across restarts and deploys. Without it everything would be wiped.
[mounts]
  source = "jarvis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine awake so reminders, briefings and missions still run
  # while you are not looking. Set auto_stop_machines = "stop" and
  # min_machines_running = 0 to sleep when idle (cheaper, but the proactive
  # features pause while asleep).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"           # 1gb is smoother if your allowance permits
